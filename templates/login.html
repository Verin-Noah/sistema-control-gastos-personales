{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<section class="tarjeta angosta">
  <h1>Iniciar sesión</h1>
  <form method="post">
    <label>Correo <input type="email" name="correo" value="{{ correo }}" required></label>
    <label>Contraseña <input type="password" name="contrasena" required></label>
    <button type="submit">Entrar</button>
  </form>
  <p>¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a></p>
</section>
{% endblock %}
