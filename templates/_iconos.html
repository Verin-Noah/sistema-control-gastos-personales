{# Íconos dibujados con líneas (SVG). Toman el color del texto que los rodea. #}
{% macro icono(nombre) %}
<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if nombre == 'gasto' %}<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>
{% elif nombre == 'lista' %}<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
{% elif nombre == 'ingreso' %}<circle cx="12" cy="12" r="9"/><path d="M12 6.5v11M9 9.5c0-1.2 1.3-2 3-2s3 .8 3 2-1.3 1.8-3 2.2-3 1-3 2.3 1.3 2 3 2 3-.8 3-2"/>
{% elif nombre == 'deuda' %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>
{% elif nombre == 'meta' %}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>
{% elif nombre == 'etiqueta' %}<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1"/>
{% endif %}
</svg>
{% endmacro %}
